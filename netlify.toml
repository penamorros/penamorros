[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  # Disable secrets scanning for Firebase keys
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "true"

# Ignore Firebase configuration files from secrets scanning
[[headers]]
  for = "/*"
  [headers.values]
    # SAMEORIGIN, not DENY (round 4b): the AI twin's 3D avatar runs in /avatar.html inside an iframe on this same site. DENY blocked it on
    # Netlify (the local preview server ignores this file), leaving the still picture. Other sites still can't frame this one.
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Redirect rules
# Note: Netlify Functions are automatically handled, no redirect needed
# Redirect all routes to index.html for SPA (except functions which are handled automatically)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
